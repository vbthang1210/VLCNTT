<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Audio Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    
    <!-- Header -->
    <header>
      <h1>Điều khiển âm thanh ESP32</h1>
      <div class="device-input-wrap">
        <label for="deviceId">Device ID:</label>
        <input id="deviceId" value="esp32_01">
      </div>
    </header>

    <!-- Message -->
    <div id="message" role="status">Sẵn sàng</div>

    <!-- Playback & Audio Selection -->
    <section class="section">
      <div class="section-title">Phát âm thanh</div>
      
      <div class="form-group">
        <label for="audioList">Danh sách tệp âm thanh</label>
        <select id="audioList">
          <option value="">Đang tải danh sách…</option>
        </select>
      </div>

      <div class="form-group">
        <label for="audioPreview">Nghe lại trên Web</label>
        <audio id="audioPreview" controls preload="none"></audio>
      </div>

      <div id="audioRecords" class="audio-records" aria-live="polite"></div>

      <div class="controls">
        <button id="play">PLAY</button>
        <button id="pause">PAUSE</button>
        <button id="stop">STOP</button>
      </div>

      <div class="form-group">
        <label for="volume">Âm lượng (<span id="volumeValue">70</span>%)</label>
        <div class="volume-wrap">
          <input id="volume" type="range" min="0" max="100" value="70">
        </div>
      </div>
    </section>

    <!-- INMP441 Recording -->
    <section class="section">
      <div class="section-title">Ghi âm từ Micro INMP441</div>
      <div class="record-form">
        <div class="form-group">
          <label for="recordDuration">Thời lượng (giây)</label>
          <input id="recordDuration" type="number" min="1" max="60" value="5">
        </div>
        <div class="controls">
          <button id="recordStart">Bắt đầu ghi</button>
          <button id="recordStop" disabled>Dừng ghi</button>
          <span id="recordCountdown" class="record-countdown" aria-live="polite"></span>
        </div>
      </div>
      <p class="hint">PCM 16 kHz · Mono · 16-bit · WAV được lưu tại Backend</p>
    </section>

    <!-- Upload Audio -->
    <section class="section">
      <div class="section-title">Tải lên tệp (MP3 / WAV)</div>
      <div class="form-group">
        <input id="upload" type="file" accept="audio/mpeg,audio/wav,.mp3,.wav">
      </div>
    </section>

    <!-- Text to Speech -->
    <section class="section">
      <div class="section-title">Tạo giọng nói (Text-to-Speech)</div>
      <div class="form-group">
        <label for="ttsText">Nhập văn bản</label>
        <textarea id="ttsText" rows="3" placeholder="Nhập văn bản cần phát qua loa..."></textarea>
      </div>
      <button id="tts">Tạo TTS</button>
    </section>

    <!-- Device Status -->
    <section class="section">
      <div class="section-title">Trạng thái thiết bị (Telemetry)</div>
      <pre id="status">Đang nạp dữ liệu…</pre>
    </section>

  </div>

  <script src="/app.js"></script>
</body>
</html>
