[project]
name = "esp32-audio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "paho-mqtt>=1.6,<2.0",
  "edge-tts>=7.0,<8.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
