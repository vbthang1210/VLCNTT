[project]
name = "esp32-audio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "paho-mqtt>=2.0,<3.0",
  "torch>=2.2,<3.0",
  "torchaudio>=2.2,<3.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
